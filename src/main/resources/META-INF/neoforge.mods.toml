modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}

Server-side ONLY anti-cheat mod - no client installation required.
Works as a companion to RaeYNCheat (optional) to provide in-game cheat detection
after boot protection is complete.'''

# This mod is SERVER-SIDE ONLY
[[mods.${mod_id}.properties]]
serverSideOnly=true

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="SERVER"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="SERVER"

# Soft dependency on RaeYNCheat - optional integration
[[dependencies.${mod_id}]]
modId="raeyncheat"
type="optional"
versionRange="[1.0.0,)"
ordering="AFTER"
side="SERVER"
