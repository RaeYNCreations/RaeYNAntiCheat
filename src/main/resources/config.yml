# RaeYNAntiCheat Configuration for NeoForge 1.21.1
# Server-side anti-cheat taking over after RaeYNCheat boot protection

# Global Settings
enabled: true
debug-mode: false

# Performance Optimization
performance:
  # Check interval in ticks (20 ticks = 1 second)
  # Lower = more accurate but higher resource usage
  check-interval: 1
  # Use async processing for non-critical checks
  async-processing: true
  # Maximum checks per tick per player
  max-checks-per-tick: 3
  # Adjust thresholds based on server TPS
  adaptive-thresholds: true
  # Minimum TPS before reducing strictness
  min-tps-threshold: 18.0

# Violation Tracking and Certainty System
violation-tracking:
  # How long to keep violation history (seconds)
  decay-time: 300
  # Certainty calculation method: weighted, average, exponential
  calculation-method: weighted
  # Weight for recent violations (higher = more weight)
  recent-violation-weight: 1.5
  # Enable false positive detection
  false-positive-detection: true
  # Automatic certainty reduction on false positive
  false-positive-reduction: 10.0

# Threshold Configuration
thresholds:
  # Alert admins at this certainty level
  alert-threshold: 50.0
  # Begin punishment at this certainty level
  punishment-threshold: 95.0
  # Maximum certainty level
  max-certainty: 100.0

# Progressive Punishment System
punishments:
  enabled: true
  # Punishment escalation based on certainty
  levels:
    - certainty: 95.0
      action: warn
      message: "&e[AntiCheat] &cYou have been flagged for suspicious activity"
    - certainty: 96.5
      action: kick
      message: "&cKicked for suspected cheating"
    - certainty: 98.0
      action: tempban
      duration: 3600
      message: "&cTemporarily banned for cheating (1 hour)"
    - certainty: 99.0
      action: tempban
      duration: 86400
      message: "&cTemporarily banned for cheating (24 hours)"
    - certainty: 99.5
      action: ban
      message: "&cPermanently banned for cheating"

# Comprehensive Logging System
logging:
  # Log to console
  console:
    enabled: true
    level: INFO
    format: "[%time%] [%player%] [%cheat%] Certainty: %certainty%% - %details%"
  # Log to file
  file:
    enabled: true
    path: "logs/raeynantiacheat/"
    file-name: "violations-%date%.log"
    # Rotate logs daily
    rotation: daily
    # Keep logs for 30 days
    retention-days: 30
    # Include detailed stack traces
    detailed: true
  # Alert operators in-game
  alerts:
    enabled: true
    # Minimum certainty to alert ops
    min-certainty: 60.0
    # Alert format
    format: "&c[AC] &e%player% &7flagged for &c%cheat% &7(%certainty%%)"

# ==================== CHEAT DETECTION MODULES ====================

# Movement-Based Checks
movement-checks:
  # Fly Detection
  fly:
    enabled: true
    sensitivity: 5
    # Maximum blocks player can be off ground before flagging
    max-air-blocks: 4
    # Maximum time in air without jump (ticks)
    max-air-time: 40
    # Violation weight for certainty calculation
    violation-weight: 8
    
  # Speed Detection
  speed:
    enabled: true
    sensitivity: 5
    # Percentage over normal speed to flag (100 = double speed)
    threshold-percentage: 35
    # Allow burst speed (sprint jumping)
    allow-burst: true
    violation-weight: 7
    
  # NoFall Detection
  nofall:
    enabled: true
    sensitivity: 5
    # Minimum fall distance to check
    min-fall-distance: 3.0
    # Tolerance for packet manipulation
    packet-tolerance: 0.5
    violation-weight: 6
    
  # Phase/NoClip Detection
  phase:
    enabled: true
    sensitivity: 5
    # Check for moving through solid blocks
    check-solid-blocks: true
    violation-weight: 9
    
  # Jesus/Water Walk Detection
  jesus:
    enabled: true
    sensitivity: 5
    # Check for walking on water/lava
    check-liquids: true
    violation-weight: 7

# Combat-Based Checks
combat-checks:
  # KillAura/Multi-Aura Detection
  killaura:
    enabled: true
    sensitivity: 5
    # Maximum attack angle deviation (degrees)
    max-angle-deviation: 45
    # Maximum entities hit per swing
    max-entities-per-swing: 1
    # Check head rotation speed
    check-rotation-speed: true
    # Max rotation speed (degrees per tick)
    max-rotation-speed: 30
    violation-weight: 10
    
  # Reach Detection
  reach:
    enabled: true
    sensitivity: 5
    # Maximum reach distance (blocks)
    max-reach: 3.2
    # Extra tolerance for lag
    lag-tolerance: 0.3
    violation-weight: 8
    
  # Critical Hit Manipulation
  criticals:
    enabled: true
    sensitivity: 5
    # Check for impossible critical hits
    check-ground-criticals: true
    violation-weight: 7
    
  # Auto Clicker Detection
  autoclicker:
    enabled: true
    sensitivity: 5
    # Maximum CPS before flagging
    max-cps: 20
    # Check for inhuman consistency
    check-consistency: true
    violation-weight: 6
    
  # Velocity/Anti-Knockback Detection
  velocity:
    enabled: true
    sensitivity: 5
    # Minimum velocity reduction to flag (percentage)
    min-reduction: 20
    violation-weight: 8

# Block Interaction Checks
block-checks:
  # X-Ray Detection
  xray:
    enabled: true
    sensitivity: 5
    # Track valuable ore mining patterns
    track-ores:
      - minecraft:diamond_ore
      - minecraft:deepslate_diamond_ore
      - minecraft:ancient_debris
      - minecraft:emerald_ore
      - minecraft:deepslate_emerald_ore
    # Suspicious ore-to-stone ratio
    suspicious-ratio: 0.3
    # Minimum blocks mined before checking
    min-blocks-mined: 50
    # Check mining patterns and paths
    pattern-analysis: true
    violation-weight: 9
    
  # Nuker Detection
  nuker:
    enabled: true
    sensitivity: 5
    # Maximum blocks broken per second
    max-blocks-per-second: 5
    # Maximum break radius
    max-radius: 3
    violation-weight: 9
    
  # Scaffold/Tower Detection
  scaffold:
    enabled: true
    sensitivity: 5
    # Maximum blocks placed per second
    max-blocks-per-second: 12
    # Check for impossible placements
    check-angles: true
    violation-weight: 7
    
  # Fast Break Detection
  fastbreak:
    enabled: true
    sensitivity: 5
    # Percentage faster than normal to flag
    threshold-percentage: 30
    violation-weight: 7
    
  # Fast Place Detection
  fastplace:
    enabled: true
    sensitivity: 5
    # Minimum time between placements (ms)
    min-delay: 50
    violation-weight: 6

# Player State Checks
player-checks:
  # Infinite Health/God Mode Detection
  infinite-health:
    enabled: true
    sensitivity: 5
    # Check for no health decrease on damage
    check-damage-events: true
    # Check for instant regeneration
    check-regeneration: true
    # Minimum damage to track
    min-damage: 1.0
    violation-weight: 10
    
  # Abnormal Regeneration
  regeneration:
    enabled: true
    sensitivity: 5
    # Maximum health per tick
    max-health-per-tick: 0.5
    # Check for hunger-independent regen
    check-hunger: true
    violation-weight: 8
    
  # OP Guard Detection (preventing de-op)
  op-guard:
    enabled: true
    sensitivity: 5
    # Detect permission manipulation attempts
    check-permission-changes: true
    # Track command execution patterns
    track-commands: true
    # Suspicious commands to monitor
    monitored-commands:
      - op
      - deop
      - permissions
      - luckperms
    violation-weight: 10
    
  # Freecam Detection
  freecam:
    enabled: true
    sensitivity: 5
    # Maximum distance between player and camera
    max-distance: 5.0
    # Check for interaction while far from body
    check-interactions: true
    violation-weight: 7

# Inventory Manipulation Checks
inventory-checks:
  # Chest Stealer Detection
  chest-stealer:
    enabled: true
    sensitivity: 5
    # Maximum items taken per second
    max-items-per-second: 10
    violation-weight: 6
    
  # Inventory Move Detection
  inventory-move:
    enabled: true
    sensitivity: 5
    # Check for movement while in inventory
    check-movement: true
    violation-weight: 5
    
  # Auto Armor Detection
  auto-armor:
    enabled: true
    sensitivity: 5
    # Maximum time to equip armor (ms)
    max-equip-time: 100
    violation-weight: 6

# Other Checks
other-checks:
  # Fast Bow Detection
  fastbow:
    enabled: true
    sensitivity: 5
    # Minimum draw time (ticks)
    min-draw-time: 3
    violation-weight: 7
    
  # Blink Detection (packet spoofing)
  blink:
    enabled: true
    sensitivity: 5
    # Maximum position change without packets
    max-position-change: 10.0
    violation-weight: 8
    
  # Timer Detection (game speed manipulation)
  timer:
    enabled: true
    sensitivity: 5
    # Percentage deviation allowed
    deviation-percentage: 10
    violation-weight: 9
    
  # Anti-Knockback Detection
  anti-knockback:
    enabled: true
    sensitivity: 5
    # Minimum knockback reduction to flag
    min-reduction: 30
    violation-weight: 8

# Bypass Permissions
permissions:
  # Players with this permission bypass all checks
  bypass-all: "raeynantiacheat.bypass"
  # Individual check bypasses
  bypass-prefix: "raeynantiacheat.bypass."
